name: temporary-public-readme-audit

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: export clean source
        run: |
          mkdir -p /tmp/eason-trading-clean
          git archive HEAD | tar -x -C /tmp/eason-trading-clean
      - name: run release verifier
        working-directory: /tmp/eason-trading-clean
        run: node scripts/verify-release.mjs
      - name: run shared smart-trigger tests
        working-directory: /tmp/eason-trading-clean
        run: node --test shared/smart-trigger.test.mjs
      - name: publish success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d '{"state":"success","context":"readme-audit/verify","description":"clean-source verify-release + smart-trigger passed"}'
      - name: publish failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d '{"state":"failure","context":"readme-audit/verify","description":"clean-source verification failed"}'
